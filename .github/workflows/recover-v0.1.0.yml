name: Recover v0.1.0 release

'on':
  workflow_dispatch:

permissions:
  contents: read

jobs:
  recover:
    name: Build and publish the verified v0.1.0 tag
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    environment: release
    permissions:
      actions: read
      attestations: write
      contents: write
      id-token: write
    env:
      RELEASE_TAG: v0.1.0
      SOURCE_RUN_ID: '31460697024'
      TARGET_COMMIT: 899d9bc2336465cb99a11c03037cecf356ff6c33
    steps:
      - name: Verify the original release gates
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          run_json="$(gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${SOURCE_RUN_ID}")"
          jq -e --arg sha "$TARGET_COMMIT" '.head_sha == $sha and .conclusion == "failure"' <<< "$run_json" >/dev/null
          required='[
            "Reject an existing release",
            "quality / rust / MSRV",
            "quality / rust / fmt, clippy, test",
            "quality / rust / coverage",
            "quality / wasm / wasm-pack build",
            "quality / wasm / Playwright Chromium smoke",
            "documentation / Markdown and repository docs",
            "documentation / Workflow security",
            "supply-chain / audit / cargo-deny and cargo-audit",
            "supply-chain / audit / zizmor"
          ]'
          jobs_json="$(gh api --paginate "repos/${GITHUB_REPOSITORY}/actions/runs/${SOURCE_RUN_ID}/jobs" | jq -s '[.[].jobs[]]')"
          jq -n -e --argjson required "$required" '
            all($required[]; . as $name | any($jobs[]; .name == $name and .conclusion == "success"))
          ' --argjson jobs "$jobs_json" >/dev/null

      - name: Check out the immutable release tag
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: v0.1.0
          fetch-depth: 0
          persist-credentials: false

      - name: Verify tag identity and release absence
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          test "$(git rev-parse 'refs/tags/v0.1.0^{commit}')" = "$TARGET_COMMIT"
          status="$(curl --proto '=https' --tlsv1.2 --silent --show-error \
            --output /dev/null --write-out '%{http_code}' \
            --header "Accept: application/vnd.github+json" \
            --header "Authorization: Bearer ${GH_TOKEN}" \
            --header "X-GitHub-Api-Version: 2022-11-28" \
            "${GITHUB_API_URL}/repos/${GITHUB_REPOSITORY}/releases/tags/${RELEASE_TAG}")"
          test "$status" = 404

      - name: Install Rust and wasm-pack
        run: |
          set -euo pipefail
          rustup toolchain install 1.85.0 --profile minimal --no-self-update
          rustup toolchain install 1.95.0 --profile minimal --no-self-update
          rustup target add wasm32-unknown-unknown --toolchain 1.85.0
          cargo +1.95.0 install wasm-pack --version 0.15.0 --locked

      - name: Build the tagged WASM package
        env:
          RUSTUP_TOOLCHAIN: 1.85.0
        run: wasm-pack build --target web crates/dmg_background_web --out-dir pkg --out-name dmg_background_web -- --locked

      - name: Assemble the tagged Pages tree
        run: |
          set -euo pipefail
          ruby scripts/assemble_pages.rb --wasm-package crates/dmg_background_web/pkg

      - name: Build deterministic release evidence
        run: |
          set -euo pipefail
          package="dmg_background-web-v0.1.0"
          mkdir -p "staging/${package}" release-candidate
          cp -R dist/. "staging/${package}/"
          cp LICENSE README.md README.zh-CN.md CHANGELOG.md "staging/${package}/"
          epoch="$(git show -s --format=%ct "$TARGET_COMMIT")"
          find staging -exec touch -h -d "@${epoch}" {} +
          TZ=UTC tar --sort=name --mtime="@${epoch}" --owner=0 --group=0 --numeric-owner \
            -czf "release-candidate/${package}.tar.gz" -C staging "$package"
          created="$(git show -s --format=%cI "$TARGET_COMMIT")"
          CREATED="$created" ruby -r digest -r json -r time <<'RUBY'
          bundle = "release-candidate"
          archive = File.join(bundle, "dmg_background-web-v0.1.0.tar.gz")
          sha1 = Digest::SHA1.file(archive).hexdigest
          sha256 = Digest::SHA256.file(archive).hexdigest
          sbom = {
            "spdxVersion" => "SPDX-2.3",
            "dataLicense" => "CC0-1.0",
            "SPDXID" => "SPDXRef-DOCUMENT",
            "name" => "#{ENV.fetch("GITHUB_REPOSITORY")} release 0.1.0",
            "documentNamespace" => "https://github.com/#{ENV.fetch("GITHUB_REPOSITORY")}/release-candidates/#{ENV.fetch("TARGET_COMMIT")}/#{ENV.fetch("GITHUB_RUN_ID")}",
            "creationInfo" => {"created" => Time.iso8601(ENV.fetch("CREATED")).utc.iso8601, "creators" => ["Tool: tinkora-release-recovery"]},
            "packages" => [{
              "SPDXID" => "SPDXRef-Package",
              "name" => ENV.fetch("GITHUB_REPOSITORY"),
              "versionInfo" => "0.1.0",
              "downloadLocation" => "NOASSERTION",
              "filesAnalyzed" => true,
              "packageVerificationCode" => {"packageVerificationCodeValue" => Digest::SHA1.hexdigest(sha1)},
              "licenseConcluded" => "NOASSERTION",
              "licenseDeclared" => "NOASSERTION",
              "copyrightText" => "NOASSERTION"
            }],
            "files" => [{
              "SPDXID" => "SPDXRef-File-1",
              "fileName" => "./dmg_background-web-v0.1.0.tar.gz",
              "checksums" => [
                {"algorithm" => "SHA1", "checksumValue" => sha1},
                {"algorithm" => "SHA256", "checksumValue" => sha256}
              ],
              "licenseConcluded" => "NOASSERTION",
              "licenseInfoInFiles" => ["NOASSERTION"],
              "copyrightText" => "NOASSERTION"
            }],
            "relationships" => [
              {"spdxElementId" => "SPDXRef-DOCUMENT", "relationshipType" => "DESCRIBES", "relatedSpdxElement" => "SPDXRef-Package"},
              {"spdxElementId" => "SPDXRef-Package", "relationshipType" => "CONTAINS", "relatedSpdxElement" => "SPDXRef-File-1"}
            ]
          }
          File.write(File.join(bundle, "SBOM.spdx.json"), JSON.pretty_generate(sbom) + "\n", encoding: "UTF-8")
          license = File.join(ENV.fetch("GITHUB_WORKSPACE"), "LICENSE")
          licenses = {"licenses" => [{"name" => "LICENSE", "sha256" => Digest::SHA256.file(license).hexdigest, "text" => File.read(license, encoding: "UTF-8")}]}
          File.write(File.join(bundle, "LICENSES.json"), JSON.pretty_generate(licenses) + "\n", encoding: "UTF-8")
          RUBY
          (
            cd release-candidate
            : > SHA256SUMS
            while IFS= read -r -d '' file; do shasum -a 256 -- "$file" >> SHA256SUMS; done < <(find . -maxdepth 1 -type f ! -name SHA256SUMS -print0 | LC_ALL=C sort -z)
          )
          ruby <<'RUBY'
          changelog = File.read("CHANGELOG.md", encoding: "UTF-8")
          match = changelog.match(/^## \[0\.1\.0\] - \d{4}-\d{2}-\d{2}$/)
          raise "CHANGELOG.md has no 0.1.0 release section" unless match
          boundaries = [
            changelog.match(/^## /, match.end(0)),
            changelog.match(/^\[[^\]]+\]:\s+\S+$/, match.end(0))
          ].compact
          boundary_offset = boundaries.map { |boundary| boundary.begin(0) }.min || changelog.length
          notes = changelog[match.end(0)...boundary_offset].strip
          raise "CHANGELOG.md 0.1.0 section is empty" if notes.empty?
          File.write("release-candidate/release-notes.md", "#{notes}\n", encoding: "UTF-8")
          RUBY

      - name: Verify checksums and candidate paths
        run: |
          set -euo pipefail
          (cd release-candidate && sha256sum --check --strict SHA256SUMS)
          expected=(dmg_background-web-v0.1.0.tar.gz SBOM.spdx.json LICENSES.json SHA256SUMS)
          for name in "${expected[@]}"; do test -f "release-candidate/$name"; done
          test "$(find release-candidate -maxdepth 1 -type f | wc -l | tr -d ' ')" = 5

      - name: Attest build provenance
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: release-candidate/dmg_background-web-v0.1.0.tar.gz

      - name: Attest SBOM
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: release-candidate/dmg_background-web-v0.1.0.tar.gz
          sbom-path: release-candidate/SBOM.spdx.json

      - name: Publish the immutable release
        env:
          GH_REPO: ${{ github.repository }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          release_id="$(gh api --method POST "repos/${GH_REPO}/releases" -f tag_name=v0.1.0 -f target_commitish="$TARGET_COMMIT" -f name=v0.1.0 -f body="$(cat release-candidate/release-notes.md)" -F draft=true -F prerelease=false --jq '.id')"
          gh release upload v0.1.0 release-candidate/dmg_background-web-v0.1.0.tar.gz release-candidate/SBOM.spdx.json release-candidate/LICENSES.json release-candidate/SHA256SUMS
          gh api --method PATCH "repos/${GH_REPO}/releases/${release_id}" -F draft=false --jq '.draft' | grep -qx false
